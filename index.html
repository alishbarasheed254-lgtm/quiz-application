    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <div class="quiz-box mx-auto">

            <div class="text-center mb-4">
                <h2>JavaScript Quiz</h2>
                <p>Test your knowledge and learn something new!</p>
            </div>

            <div class="d-flex justify-content-between mb-2">
                <span id="question-number">Question 1</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="progress mb-4">
                <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
            </div>

            <h5 id="question">Question will appear here</h5>

            <div id="options" class="mt-4"></div>

            <p id="result" class="mt-3"></p>

            <button id="next-btn" class="btn next-btn w-100 mt-2" disabled>
                Next Question
            </button>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
